created: '2026-06-12'
modified: '2026-06-12'
specificationVersion: '0.19'

apis:
  - aid: d-id-videos-api
    name: D-ID Videos API
    description: >
      REST API for generating AI talking-head videos from a source image combined with a
      text script or audio file. Supports multiple avatar versions including V4 Expressive
      (full-HD with dynamic expressions), V3 Pro, V3 Instant (personal avatars from short
      clips), and V2 Photo avatars. Returns asynchronous job results via polling or webhook.
    humanURL: https://docs.d-id.com/reference/createtalk
    baseURL: https://api.d-id.com
    tags:
      - AI Video
      - Talking Head
      - Avatar
      - Text to Video
    properties:
      - type: Documentation
        url: https://docs.d-id.com/reference/get-started
      - type: OpenAPI
        url: openapi/d-id-videos-openapi.yml
      - type: JSONSchema
        url: json-schema/d-id-talk-schema.json
      - type: Examples
        url: examples/d-id-create-talk-example.json
      - type: Examples
        url: examples/d-id-create-translation-example.json

  - aid: d-id-agents-api
    name: D-ID Agents API
    description: >
      API for creating and managing interactive real-time AI agents that combine digital
      avatar streaming with large language models, RAG-based knowledge bases, and custom
      tools. Supports WebRTC and LiveKit-powered streaming sessions, conversation memory,
      chat export, and integration with third-party LLM providers. Enables face-to-face
      AI conversations at scale.
    humanURL: https://docs.d-id.com/reference/agents
    baseURL: https://api.d-id.com
    tags:
      - AI Agents
      - Real-Time Streaming
      - Digital Humans
      - WebRTC
      - LLM Integration
    properties:
      - type: Documentation
        url: https://docs.d-id.com/reference/agents
      - type: OpenAPI
        url: openapi/d-id-agents-openapi.yml
      - type: JSONSchema
        url: json-schema/d-id-agent-schema.json
      - type: Examples
        url: examples/d-id-create-agent-example.json

  - aid: d-id-translations-api
    name: D-ID Translations API
    description: >
      API for translating existing videos into 100+ languages using AI-driven speech
      translation, voice cloning, and lip-sync technology. Enables brands and content
      creators to localize video content at scale without re-recording or manual dubbing.
    humanURL: https://docs.d-id.com/reference/translations
    baseURL: https://api.d-id.com
    tags:
      - Video Translation
      - Voice Cloning
      - Lip Sync
      - Localization
    properties:
      - type: Documentation
        url: https://docs.d-id.com/reference/translations

