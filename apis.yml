aid: d-id
name: D-ID
description: >
  D-ID is an AI-powered platform for generating talking-head videos and interactive digital
  human experiences from still photos, text scripts, and audio narration. Developers can
  access REST APIs to produce pre-rendered talking avatar videos, perform real-time
  streaming agent conversations via WebRTC, translate videos into 100+ languages with voice
  cloning and lip-sync, and create custom AI agents backed by LLMs and RAG knowledge bases.
  The platform has generated over 150 million videos and supports parallel processing of
  tens of thousands of simultaneous API requests. D-ID serves use cases ranging from
  enterprise training and customer service to personalized marketing campaigns and language
  learning applications.
